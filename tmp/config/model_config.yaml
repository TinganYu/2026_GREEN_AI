model:
  name: "meta-llama/Llama-3.2-1B-Instruct"  # meta-llama/Llama-3.2-1B-Instruct, quant_models/llama-3.2-1b-it-gptq-test, quantized/bnb
  
  # Model loading parameters
  dtype: "float16"
  device_map: "cuda:0"
  trust_remote_code: true

quantization:
  enabled: true
  framework: "gptq"   # 可選: gptq, awq, bnb

  methods:
    gptq:
      bits: 4
      group_size: 128          # -1 表示不分組
      damp_percent: 0.05
      damp_auto_increment: 0.01
      desc_act: true
      act_group_aware: False
      static_groups: False
      sym: true
      true_sequential: true
      lm_head: False
      mse: 0.0
      rotation: null
      calib_num: 1024
      output_dir: null  #"quantized/gptq"

    awq:
      zero_point: true
      q_group_size: 128
      w_bit: 4
      version: "gemm"         # 選項: gemm, gemv, marlin, gemv_fast
      modules_to_not_convert: []
      output_dir: null  #"quantized/awq"

    bnb:
      bits: 4
      bnb_4bit_quant_type: "nf4"
      bnb_4bit_use_double_quant: true
      bnb_4bit_compute_dtype: "bfloat16"
      llm_int8_threshold: 6.0
      llm_int8_skip_modules: ["lm_head"]
      llm_int8_has_fp16_weight: false
      llm_int8_enable_fp32_cpu_offload: false
      output_dir: null  #"quantized/bnb"

dataset:
  # 選擇要評估的資料集（可以是列表）
  selected: ["gsm8k"]  # 或 ["gsm8k", "truthfulqa", "commonsenseqa", "humaneval", "bbh"]
  # 資料集詳細配置從 dataset_config.yaml 讀取
  config_file: "tmp/config/dataset_config.yaml"
  
  # 可以覆寫 dataset_config.yaml 中的參數
  override:
    num_samples: null  # null 表示使用 dataset_config.yaml 中的設定