# ============================================
# LLM Multi-Agent 量化優化配置 (Phase 1 MVP)
# ============================================

experiment:
  name: "Llama-3.2-1B-Instruct"    #llm-multiagent-mvp
  output_dir: "results/llm_optimization"

# --------------------------------------------
# 1. 基線配置
# --------------------------------------------
baseline:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"
  model_dtype: "float16"
  device_map: "cuda:0"
  trust_remote_code: true

  # 資料集評估配置
  datasets:
    gsm8k:
      enabled: true
      num_samples: 50
    truthfulqa:
      enabled: true
      num_samples: 50

# --------------------------------------------
# 2. 量化評估配置
# --------------------------------------------
quantization_eval:
  use_same_datasets_as_baseline: true

# ====================================================================
# 3. 多目標優化配置
# ====================================================================
multiobjective:
  objectives:
    - name: "accuracy_change"
      direction: "maximize"
      weight: 2.0                  # 統一權重：用於推薦配置 + 計算違反分數
      # reference_point: -0.15

    - name: "gpu_peak_change"
      direction: "minimize"
      weight: 1.0                  # GPU 內存的相對重要性
      # reference_point: 0.10

    - name: "latency_change"
      direction: "minimize"
      weight: 1.0                  # 推理延遲的相對重要性
      # reference_point: 0.50

  # 聚合方法
  aggregation:
    method: "weighted"
    dataset_weights:
      gsm8k: 0.50
      truthfulqa: 0.50

  # 硬約束（Phase 1不使用）
  constraints:
    enabled: false

  # 用戶目標（用於推薦）
  targets:
    accuracy_min: -0.10
    gpu_peak_max: -0.50
    latency_max: 1.0

# --------------------------------------------
# 4. LLM Multi-Agent 優化器配置 ⭐
# --------------------------------------------
optimizer:
  type: "llm_multiagent"  # 使用LLM multi-agent optimizer

  # === LLM配置 ===
  llm_agent:
    # LLM Provider
    provider: "openai"  # or "anthropic"
    model: "gpt-5-mini"
    api_key_env: "OPENAI_API_KEY"

    # 生成參數
    temperature: 0.7
    max_tokens: 2048

    # Prompt 配置
    prompt:
      config_file: "tmp/config/prompt_config.yaml"  # Prompt 配置檔路徑
      type: "zh"  # Prompt 類型（參見 prompt_config.yaml 中的 supported_types）
                  # 可選: "en" (English), "zh" (繁體中文), 或自定義類型

    # Agent特定溫度
    agent_temperatures:
      analyzer: 0.3    # 低溫保證一致性
      planner: 0.7     # 中高溫增加創造力
      monitor: 0.4     # 低中溫保證穩定評估

    # Trial限制
    max_trials: 15     # Phase 1: 小規模測試
    min_trials: 10      # 最少試驗數

  # === 停止條件（簡化） ===
  stopping:
    budget:
      max_trials: 5
      max_time_hours: 24

    convergence:
      enabled: false
      window: 3              # 連續3輪無改善
      threshold: 0.05        # 收斂閾值（當前版本未使用，基於Pareto大小變化判斷）

  # === 簡單的規則驗證（替代ExpertAgent） ===
  validation:
    rules:
      - "gptq.act_group_aware=True requires desc_act=False"
      # - "bits=2 not recommended for models <1B"
    check_gpu_memory: true
    max_expected_gpu_gb: 16

  # === Fallback機制 ===
  fallback:
    on_llm_failure: "stop"  # LLM失敗時的行為: "random" (降級到隨機) 或 "stop" (直接停止優化)
    max_llm_failures: 3       # 超過N次失敗後觸發fallback策略

  # === 對話日誌 ===
  logging:
    save_conversations: true
    conversation_file: "agent_conversations.jsonl"
    save_prompts: true  # 調試用

  # === 搜索空間（簡化版）===
  search_space:
    methods: ["gptq", "awq", "bnb"]

    gptq:
      bits: [2, 3, 4, 8]
      group_size: [-1, 16, 32, 64, 128]
      calib_num: [256]
      desc_act: [true, false]
      sym: [true, false]
      damp_percent: [0.001, 0.005, 0.01, 0.03, 0.05]
      damp_auto_increment: [0.001, 0.005, 0.01, 0.03, 0.05]
      act_group_aware: [true, false]  # `act_group_aware` == `True` requires `desc_act` == `False`
      static_groups: [true, false]
      true_sequential: [true, false]
      lm_head: [false]
      mse: [0.0, 0.1, 0.2]
      rotation: [null]

    awq:
      w_bit: [4]
      q_group_size: [16, 32, 64, 128]
      zero_point: [true, false]
      version: ["gemm"]
      modules_to_not_convert: [["lm_head"], []]

    bnb:
      bits: [4, 8]
      bnb_4bit_quant_type: ["nf4", "fp4"]
      bnb_4bit_use_double_quant: [true, false]
      bnb_4bit_compute_dtype: ["float16", "bfloat16"]
      llm_int8_threshold: [4.0, 4.5, 5.0, 6.0]
      llm_int8_skip_modules: [["lm_head"]]
      llm_int8_has_fp16_weight: [false]
      llm_int8_enable_fp32_cpu_offload: [false]

# --------------------------------------------
# 5. 輸出和視覺化
# --------------------------------------------
output:
  save_all_trials: true
  save_pareto_frontier: true

  recommendation:
    strategy: "closest_to_target"

  visualization:
    enabled: false
    plot_types:
      - "3d_pareto"
      - "parallel_coordinates"
      - "trade_off_matrix"
    output_format: "html"

# --------------------------------------------
# 6. 日誌記錄和快取
# --------------------------------------------
logging:
  level: "INFO"
  save_logs: true
  log_file: "optimization.log"

cache:
  enable_baseline_cache: true
  cache_dir: ".cache/optimization"
