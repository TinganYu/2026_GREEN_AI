# ============================================
# 多目標優化快速測試配置
# 用於快速測試（15-20 分鐘）
# ============================================

experiment:
  name: "quick-mo-test"
  output_dir: "results/optimization"

# --------------------------------------------
# 基線 - 小樣本數量以快速測試
# --------------------------------------------
baseline:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"  # 使用 Instruct 版本以支援推理任務
  model_dtype: "float16"
  device_map: "cuda:0"
  trust_remote_code: true

  datasets:
    gsm8k:
      enabled: true
      num_samples: 50              # 為快速測試而減少
    truthfulqa:
      enabled: true
      num_samples: 50
    commonsenseqa:
      enabled: false
      num_samples: 20
    humaneval:
      enabled: false               # 為提高速度而停用
    bbh:
      enabled: false

# --------------------------------------------
# 量化評估 - 更小的樣本數量
# --------------------------------------------
quantization_eval:
  use_same_datasets_as_baseline: false

  custom_datasets:
    gsm8k:
      num_samples: 25              # 為快速測試而減少
    truthfulqa:
      num_samples: 25

# ====================================================================
# 多目標配置
# ====================================================================
# 目標值說明：
#   - accuracy_change：準確率變化量（正=上升，負=下降）
#   - gpu_peak_change：GPU 峰值內存變化量（負=減少，正=增加）
#   - latency_change：推理延遲變化量（負=減少，正=增加）
#
# 計算公式：change = (量化後 - 基線) / 基線
# ====================================================================
multiobjective:
  objectives:
    - name: "accuracy_change"
      direction: "maximize"        # 最大化準確率變化（期望正值=上升）
      weight: 2.0                  # 統一權重：用於推薦配置 + 計算違反分數
      reference_point: -0.15       # 參考點：下降 15%（最壞情況）
      description: "準確率變化量（正=上升，負=下降）"

    - name: "gpu_peak_change"
      direction: "minimize"        # 最小化 GPU 峰值變化（期望負值=減少）
      weight: 1.0                  # GPU 內存的相對重要性
      reference_point: 0.10        # 參考點：增加 10%（最壞情況）
      description: "GPU 峰值內存變化量（負=減少，正=增加）"

    - name: "latency_change"
      direction: "minimize"        # 最小化延遲變化（期望負值=減少）
      weight: 1.0                  # 推理延遲的相對重要性
      reference_point: 0.50        # 參考點：增加 50%（最壞情況）
      description: "推理延遲變化量（負=減少，正=增加）"

  aggregation:
    method: "average"              # 快速測試使用簡單平均

  constraints:
    enabled: false
    accuracy_min: -0.50
    gpu_peak_max: -0.10
    latency_max: 3.00

  targets:
    accuracy_min: -0.30
    gpu_peak_max: -0.30
    latency_max: 1.00

# --------------------------------------------
# 優化器 - 為快速測試減少試驗次數
# --------------------------------------------
optimizer:
  type: "optuna_multiobjective"

  optuna:
    n_trials: 10                   # 快速測試僅 15 次試驗
    n_startup_trials: 5            # 僅 5 次隨機試驗

    sampler: "TPESampler"

    tpe_params:
      n_ei_candidates: 24
      multivariate: true
      constant_liar: false

  # 縮小的搜索空間 - 僅測試 2 種方法
  search_space:
    methods: ["gptq", "awq", "bnb"]

    gptq:
      bits: [2, 3, 4, 8]
      group_size: [-1, 16, 32, 64, 128]
      calib_num: [256]
      desc_act: [true, false]
      sym: [true, false]
      damp_percent: [0.001, 0.005, 0.01, 0.03, 0.05]
      damp_auto_increment: [0.001, 0.005, 0.01, 0.03, 0.05]
      act_group_aware: [false]  # `act_group_aware` == `True` requires `desc_act` == `False`
      static_groups: [true, false]
      true_sequential: [true, false]
      lm_head: [false]
      mse: [0.0, 0.1, 0.2]
      rotation: [null]

    awq:
      w_bit: [4]
      q_group_size: [16, 32, 64, 128]
      zero_point: [true, false]
      version: ["gemm"]
      modules_to_not_convert: [["lm_head"], ["embed_tokens"], ["lm_head", "embed_tokens"], ["lm_head", "layers.*norm*"] , []]

    bnb:
      bits: [4, 8]
      bnb_4bit_quant_type: ["nf4", "fp4"]
      bnb_4bit_use_double_quant: [true, false]
      bnb_4bit_compute_dtype: ["float16", "bfloat16"]
      llm_int8_threshold: [4.0, 4.5, 5.0, 6.0]
      llm_int8_skip_modules: [["lm_head"]]
      llm_int8_has_fp16_weight: [false]
      llm_int8_enable_fp32_cpu_offload: [false]

# --------------------------------------------
# 輸出
# --------------------------------------------
output:
  save_all_trials: true
  save_pareto_frontier: true

  recommendation:
    strategy: "closest_to_target"

  visualization:
    enabled: false
    plot_types:
      - "3d_pareto"                # 3D Pareto 前沿
      - "parallel_coordinates"     # 平行座標圖
      - "trade_off_matrix"         # 權衡矩陣
    output_format: "html"          # html / png / pdf

# --------------------------------------------
# 日誌記錄
# --------------------------------------------
logging:
  level: "INFO"
  save_logs: true
  log_file: "optimization_quick.log"

cache:
  enable_baseline_cache: true
  cache_dir: ".cache/optimization"
