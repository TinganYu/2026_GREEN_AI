# AWQ via GPTQModel (autoawq-compatible)
# Quantizes with GPTQModel's AWQ, output loadable by both GPTQModel and autoawq.
#
# autoawq compatibility requires:
#   - format: llm_awq
#   - pack_dtype: int32  (autoawq expects int32, NOT int16)
#   - sym: false         (autoawq expects zero_point=True, which requires sym=false)

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  output_dir: null
  output_base: "quantized_test"

calibration:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  split: "train"
  num_samples: 256
  text_column: "question+answer"
  batch_size: 1

quantization:
  quant_method: "awq"
  bits: 4
  group_size: 128
  sym: false              # false → zero_point=True (autoawq compatible)
  true_sequential: true
  format: "llm_awq"
  pack_dtype: "int32"     # autoawq expects int32
  offload_to_disk: true
