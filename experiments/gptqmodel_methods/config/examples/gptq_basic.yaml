# Basic GPTQ 4-bit quantization
# Standard configuration for a quick test run.

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  output_dir: null
  output_base: "quantized_test"

calibration:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  split: "train"
  num_samples: 256
  text_column: "question+answer"
  batch_size: 1

quantization:
  quant_method: "gptq"
  bits: 4
  group_size: 128
  sym: true
  true_sequential: true
  lm_head: false
  format: "gptq"
  pack_dtype: "int32"
  offload_to_disk: true
