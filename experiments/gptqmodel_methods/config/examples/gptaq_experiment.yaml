# GPTAQ experiment (Yale Lab method)
# GPTAQ extends GPTQ with activation-aware quantization for better accuracy.
# The alpha parameter controls the balance between weight and activation errors.

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  output_dir: null
  output_base: "quantized_test"

calibration:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  split: "train"
  num_samples: 256
  text_column: "question+answer"
  batch_size: 1

quantization:
  quant_method: "gptq"
  bits: 4
  group_size: 128
  sym: true
  true_sequential: true
  format: "gptq"
  pack_dtype: "int32"
  offload_to_disk: true

  # GPTAQ sub-config: passed as dict, QuantizeConfig.__post_init__ converts it
  gptaq:
    alpha: 0.25
