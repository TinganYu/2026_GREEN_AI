# ============================================================================
# GPTAQ 量化參數優化搜索空間配置
# GPTAQ Quantization Parameter Optimization Search Space Config
# ============================================================================
# GPTAQ（GPTQ + Activation-aware Quantization）
# 由耶魯大學 Lin Lab 提出的 GPTQ 擴展方法：
#   - 在 GPTQ 的 Hessian-based 量化基礎上，加入激活值誤差感知
#   - alpha 參數控制「權重誤差」vs「激活值誤差」的平衡
#   - alpha=0.0：退化為標準 GPTQ（只優化權重誤差）
#   - alpha=1.0：只優化激活值誤差
#   - alpha=0.25：預設值，平衡兩者（論文建議）
#
# 核心差異（vs GPTQ）：
#   - 添加激活感知修正，通常比純 GPTQ 提升 0.5-2% accuracy
#   - 量化時間略長（需要額外的激活值誤差計算）
#   - 使用方式：quant_method 仍為 "gptq"，但加入 gptaq 子配置
#   - 輸出格式可使用所有 GPTQ 支援的 format（gptq/gptq_v2/marlin/...）
#
# GPTAQ 參數（GPTAQConfig dataclass）：
#   alpha  : float，範圍 0.0-1.0，核心調整參數
#   device : "auto" 或指定 GPU，通常保持 "auto"
#
# 搜索空間建議（實測有效）/ Suggested search space (verified working):
#   gptaq.alpha: [0.0, 0.1, 0.25, 0.5, 0.75]  ← 最關鍵
#   bits:        [3, 4]
#   group_size:  [64, 128]
#   format:      ["gptq", "gptq_v2"]  ← marlin 實測失敗；bitblas 套件問題多
#   rotation:    固定 null（hadamard 實測量化失敗）
# ============================================================================

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  output_dir: null
  output_base: "quantized_test"

calibration:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  split: "train"
  num_samples: 256
  text_column: "question+answer"
  batch_size: 1

quantization:
  quant_method: "gptq"        # GPTAQ 是 GPTQ 的擴展，quant_method 仍為 "gptq"

  # --------------------------------------------------------------------------
  # [TUNABLE ⬆⬆⬆] bits - 量化精度
  # 影響：Accuracy ⬆⬆⬆ | GPU Memory ⬆⬆⬆ | Latency ⬆⬆⬆
  #
  # GPTAQ 在低 bits（3-bit）時比純 GPTQ 優勢更明顯
  # 因為激活感知修正能更好地補償低精度帶來的誤差
  #
  # 搜索空間：[3, 4]（GPTAQ 在 3-bit 時效果提升最顯著）
  # --------------------------------------------------------------------------
  bits: 4

  # --------------------------------------------------------------------------
  # [TUNABLE ⬆⬆] group_size - 量化粒度
  # 搜索空間：[64, 128]
  # --------------------------------------------------------------------------
  group_size: 128

  # --------------------------------------------------------------------------
  # [TUNABLE ⬆⬆] format - 推理格式
  # 影響：Accuracy ✗ | GPU Memory ⬆ | Latency ⬆⬆
  #
  # 可用格式（已實測穩定）：
  #   "gptq"    ：v1 格式，最廣泛相容  ← 起點
  #   "gptq_v2" ：v2 格式，精度略優
  #
  # ❌ 不建議使用：
  #   "marlin"  ：實測量化失敗
  #   "bitblas" ：套件相依問題多，風險高
  #   gemm, gemv, gemv_fast, llm_awq：AWQ 專用，GPTAQ 設定後 Config ERR
  #
  # 搜索空間：["gptq", "gptq_v2"]
  # --------------------------------------------------------------------------
  format: "gptq"

  # --------------------------------------------------------------------------
  # [TUNABLE ⬆] desc_act - 降序激活量化
  # 搜索空間：[true, false]（低 bits 時建議 true）
  # --------------------------------------------------------------------------
  desc_act: false

  # --------------------------------------------------------------------------
  # [TUNABLE ⬆] damp_percent - Hessian 阻尼係數
  # 同 GPTQ 建議：0.01-0.1
  # --------------------------------------------------------------------------
  damp_percent: 0.05

  # --------------------------------------------------------------------------
  # [TUNABLE ⬆] mse - MSE 量化正則化
  # 搜索空間：[0.0, 0.01, 0.05]
  # --------------------------------------------------------------------------
  mse: 0.0

  # --------------------------------------------------------------------------
  # [FIXED] rotation - 旋轉量化
  # 實測結果：rotation="hadamard" 量化失敗，固定為 null 不使用
  # --------------------------------------------------------------------------
  rotation: null

  # ==========================================================================
  # [TUNABLE ⬆⬆⬆] gptaq - GPTAQ 子配置（最關鍵的 GPTAQ 特有參數）
  # ==========================================================================
  # alpha: float，範圍 0.0-1.0
  #
  # alpha 的含義：
  #   量化目標 = (1 - alpha) × 權重誤差 + alpha × 激活值誤差
  #
  #   alpha=0.0  →  純 GPTQ（等同於不使用 gptaq sub-config）
  #   alpha=0.1  →  輕微激活感知，保守策略
  #   alpha=0.25 →  論文推薦預設值，適合多數模型  ← 推薦起點
  #   alpha=0.5  →  均等權重，激活感知更強
  #   alpha=0.75 →  激活感知主導，適合激活值分佈不均的模型
  #   alpha=1.0  →  純激活值優化（通常效果不佳）
  #
  # 選擇建議：
  #   - 先試 0.25（論文預設）
  #   - 若精度提升不明顯，試 0.5
  #   - 若模型有大量 outlier 激活值，試 0.5-0.75
  #
  # 搜索空間：[0.1, 0.25, 0.5, 0.75]
  #   （可加入 0.0 作為「退化為 GPTQ」的對照基準）
  # --------------------------------------------------------------------------
  gptaq:
    alpha: 0.25
    device: "auto"             # [FIXED] 固定 "auto"，讓 GPTQModel 自動選擇設備

  # ==========================================================================
  # 以下參數建議固定 / Parameters below are recommended to fix
  # ==========================================================================

  # [FIXED] sym: GPTQ 標準對稱量化
  sym: true

  # [FIXED] true_sequential: 穩定性最佳
  true_sequential: true

  # [FIXED] lm_head: 不量化 LM head
  lm_head: false

  # [FIXED] pack_dtype: 推理標準格式
  pack_dtype: "int32"

  # [FIXED - 僅影響量化過程] offload_to_disk
  offload_to_disk: true
