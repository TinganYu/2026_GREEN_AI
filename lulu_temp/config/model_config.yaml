# Model Configuration File for kvpress integration
model:
  name: "nvidia/Llama-3.1-Minitron-4B-Width-Base"
  
  # Model loading parameters
  torch_dtype: "float16"
  device_map: "cuda:0" #"cuda:1"
  trust_remote_code: true
  low_cpu_mem_usage: true
  attn_implementation: "eager"  # kvpress works with eager attention
  
generation:
  # Default generation parameters
  max_new_tokens: 512
  temperature: 0.7
  do_sample: true
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  
  # Math-specific generation (for GSM8K)
  math:
    temperature: 0.1
    max_new_tokens: 1024
    do_sample: false
    
kv_compression:
  # KV Cache compression settings using kvpress
  enabled: true
  compression_ratio: 0.5  # Keep 50% of tokens
  
  # Available methods: snapkv, observed_attention, streaming_llm, knorm, expected_attention
  compression_method: "snapkv"
  
  # Compression frequency (used by custom implementation)
  compression_frequency: 32
  
  # Method-specific parameters for kvpress
  methods:
    snapkv:
      window_size: 32      # Recent tokens window
      kernel_size: 5       # Pooling kernel for important token selection
    
    observed_attention:
      # Uses actual attention patterns from forward pass
      # No additional parameters needed
      pass
    
    streaming_llm:
      window_size: 512     # Sliding window size
    
    knorm:
      # Uses key norm for importance
      # No additional parameters needed
      pass
    
    expected_attention:
      # Uses expected attention patterns
      # No additional parameters needed  
      pass
  
dataset:
  name: "gsm8k"
  config: "main"
  split: "test"
  num_samples: 50
  
  prompts:
    chain_of_thought: |
      Question: {question}

      Let's solve this step-by-step:

      Answer:
    
    direct: |
      Question: {question}
      Answer:

evaluation:
  use_chain_of_thought: true
  save_results: true
  results_dir: "./results"
  
  metrics:
    - "accuracy"
    - "valid_prediction_ratio" 
    - "compression_stats"
  
  answer_patterns:
    - r"####\s*([+-]?\d*\.?\d+)"
    - r"[Aa]nswer[:\s]*([+-]?\d*\.?\d+)"
    - r"[+-]?\d*\.?\d+"
  
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  save_logs: true
  log_dir: "./logs"

system:
  device: "cuda:0" #'cuda:1'
  mixed_precision: true
  gradient_checkpointing: false
  clear_cache_frequency: 50
  torch_compile: false

tuning:
  # Hyperparameter tuning settings
  enabled: true
  adaptive: false
  
  # kvpress method options
  # Available: snapkv, observed_attention, streaming_llm, knorm, expected_attention
  compression_methods_to_test: 
      - "snapkv"           # Fast, good for most cases
      - "observed_attention"  # More accurate but slower
      - "knorm"            # Fastest, simple
      # - "streaming_llm"    # Good for long contexts  
      
  # Compression ratios to test (fraction of tokens to keep)
  compression_ratios_to_test: [0.75, 0.5, 0.3]