dataset:
  max_input_tokens: 1024
  name: alexfabbri/multi_news
  num_samples: 100
  prompts:
    summarization: 'Read the following news articles and write a comprehensive summary
      that captures the main points:


      {document}


      Summary:

      '
  split: test
evaluation:
  metrics:
  - rouge_scores
  - compression_stats
  results_dir: ./results
  rouge:
    metrics:
    - rouge1
    - rouge2
    - rougeL
    use_stemmer: true
  save_results: true
generation:
  do_sample: true
  max_new_tokens: 128
  repetition_penalty: 1.3
  temperature: 0.7
  top_k: 50
  top_p: 0.95
kv_compression:
  compression_frequency: 32
  compression_method: expected_attention
  compression_ratio: 0.6
  enabled: true
  methods:
    expected_attention: pass
    knorm: pass
    observed_attention: pass
    snapkv:
      kernel_size: 7
      window_size: 128
    streaming_llm: pass
logging:
  format: '%(asctime)s - %(levelname)s - %(message)s'
  level: INFO
  log_dir: ./logs
  save_logs: true
model:
  attn_implementation: eager
  device_map: cuda:1
  low_cpu_mem_usage: true
  name: nvidia/Llama-3.1-Minitron-4B-Width-Base
  torch_dtype: float16
  trust_remote_code: true
system:
  clear_cache_frequency: 50
  device: cuda:1
  gradient_checkpointing: false
  mixed_precision: true
  torch_compile: false
tuning:
  accuracy_weight: 1.0
  adaptive: true
  co2_weight: 0.0
  compression_methods_to_test:
  - expected_attention
  - streaming_llm
  - knorm
  compression_ratios_to_test:
  - 0.75
  - 0.3
  enable_co2_tracking: false
  enabled: true
  max_iterations: 10
