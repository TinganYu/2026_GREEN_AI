# Prompt Configuration for LLM Multi-Agent Optimization
# 支援多種 prompt 類型，可擴展至不同語言、風格、任務類型等

# 預設類型
default_type: "en"

# 支援的類型列表（可擴展：語言、風格、任務類型等）
supported_types:
  - "en"      # English
  - "zh"      # 繁體中文
  # 未來可擴展：
  # - "en_concise"    # 簡潔英文版
  # - "en_detailed"   # 詳細英文版
  # - "zh_formal"     # 正式中文版
  # - "task_specific" # 特定任務版


# ========== Prompt 模板定義 ==========
prompts:
  # ==================== English Version ====================
  en:
    metadata:
      name: "English"
      description: "Standard English prompts for LLM multi-agent optimization"
      version: "1.0"

    analyzer:
      system_role: "You are an expert analyzer for quantization optimization trials. Think step by step."

      task_description: |
        Analyze the historical trials systematically to understand what works and what doesn't.

      analysis_requirements: |
        Follow this Chain of Thought analysis process:

        ## Step 1: Method Performance Analysis
        For each quantization method (gptq/awq/bnb), analyze:
        - How many trials? How many succeeded/failed?
        - Average accuracy_change, gpu_peak_change, latency_change
        - Which method performs best for each objective?

        ## Step 2: Failure Pattern Analysis
        Look at failed trials and identify:
        - What parameter combinations caused failures?
        - Are there common patterns (e.g., bits=2 always fails)?
        - Which methods/params should be avoided?

        ## Step 3: Success Pattern Analysis
        Look at successful trials (especially Pareto solutions):
        - What parameter combinations work well?
        - What are the trade-offs between accuracy and compression?
        - Which configs achieve the best balance?

        ## Step 4: Parameter Sensitivity Analysis
        Analyze how each parameter affects the results:
        - bits: How does 2/3/4/8 bit affect accuracy and compression?
        - group_size: Does smaller/larger group_size help?
        - Other params: Any notable observations?

        ## Step 5: Strategic Recommendations
        Based on the above analysis:
        - What regions are unexplored but promising?
        - What specific configs should be tried next?

      output_format: |
        Output a JSON object with your complete analysis:
        {
          "method_analysis": {
            "gptq": {"trials": N, "success_rate": X, "avg_accuracy": Y, "avg_gpu": Z, "observations": "..."},
            "awq": {"trials": N, "success_rate": X, "avg_accuracy": Y, "avg_gpu": Z, "observations": "..."},
            "bnb": {"trials": N, "success_rate": X, "avg_accuracy": Y, "avg_gpu": Z, "observations": "..."}
          },
          "failure_patterns": [
            {"pattern": "description", "affected_params": {...}, "suggestion": "avoid/adjust"}
          ],
          "success_patterns": [
            {"pattern": "description", "winning_params": {...}, "trade_off": "accuracy vs compression"}
          ],
          "parameter_insights": {
            "bits": "observation about bits impact",
            "group_size": "observation about group_size impact",
            "other": "any other notable findings"
          },
          "unexplored_regions": [
            {"method": "...", "params": {...}, "rationale": "why promising based on above analysis"}
          ],
          "recommendations": ["strategic advice 1", "strategic advice 2"]
        }

        Output ONLY the JSON object (no other text).

      section_headers:
        your_task: "# Your Task"
        historical_trials: "# Historical Trials Summary"
        pareto_frontier: "# Current Pareto Frontier"
        search_space: "# Search Space"
        analysis_req: "# Analysis Requirements"

      labels:
        total_trials: "Total trials"
        successful_trials: "Successful trials"
        failed_trials: "Failed/Pruned trials"
        non_dominated_solutions: "non-dominated solutions found"
        recent_trials: "Recent trials"
        no_trials: "No trials yet."
        no_pareto: "No Pareto solutions yet."

    planner:
      system_role: "You are a strategic planner for quantization optimization. Think step by step before making decisions."

      decision_process: |
        # Decision Process (Chain of Thought)
        Follow these steps to decide the next configuration:

        ## Step 1: Review Analyzer's Findings
        - What methods performed best/worst?
        - What failure patterns should we avoid?
        - What success patterns should we exploit?
        - What unexplored regions are promising?

        ## Step 2: Consider User Targets
        - What is the minimum acceptable accuracy? (accuracy_min)
        - What is the maximum acceptable GPU usage? (gpu_peak_max)
        - Are we closer to meeting these targets?

        ## Step 3: Avoid Tried Configurations
        - Check the "Already Tried" list
        - Do NOT suggest configs that have been tried before
        - If exploiting, vary at least one parameter from successful configs

        ## Step 4: Choose Strategy
        - Early phase (< 20%): Explore diverse methods/params
        - Mid phase (20-70%): Balance exploration and exploitation
        - Late phase (> 70%): Focus on refining best configs

        ## Step 5: Design Next Config
        - Pick method based on analysis insights
        - Choose parameters that are promising but not yet tried
        - Ensure all params are within Search Space

      strategy_guide: |
        # Strategy Reference
        - **EXPLORATION**: Try new methods/params, prioritize unexplored_regions
        - **EXPLOITATION**: Refine successful configs, small parameter adjustments
        - **BALANCED**: Mix of both

      output_format: |
        Provide your decision in JSON format:

        {
          "thinking": {
            "analyzer_insights": "What I learned from the analysis (1-2 sentences)",
            "target_gap": "How far are we from meeting targets? (1 sentence)",
            "avoid_repeating": "Which tried configs am I avoiding? (list methods/bits)",
            "chosen_strategy_reason": "Why I chose this strategy (1 sentence)"
          },
          "strategy": "exploration" / "exploitation" / "balanced",
          "next_config": {
            "method": "gptq" / "awq" / "bnb",
            "bits": ...,
            "group_size": ...,
            ... (put all parameters FLAT here, NOT nested in "parameters")
          },
          "rationale": "Final explanation of this config choice (2-3 sentences)",
          "confidence": 0.0-1.0
        }

        Output ONLY the JSON object (no other text).

      section_headers:
        current_state: "# Current State"
        search_space: "# Search Space (Available Parameters)"
        already_tried: "# Already Tried Configurations (DO NOT REPEAT)"
        analysis_from_analyzer: "# Analysis from AnalyzerAgent"
        optimization_targets: "# Optimization Targets (Your Goals)"
        pareto_frontier: "# Current Pareto Frontier"
        your_task: "# Your Task"

      labels:
        trial: "Trial"
        progress: "Progress"
        budget_remaining: "Budget remaining"
        trials: "trials"
        solutions_on_frontier: "solutions on frontier"
        decide_next_config: "Decide the next trial configuration based on the analysis. IMPORTANT: Only use parameter values from the Search Space above!"

    formatting:
      methods: "Methods"
      and_more: "... and {count} more"
      trial_format: "Trial {num}"
      config_format: "{method}-{bits}bit"
      objectives_format: "acc:{acc}, gpu:{gpu}, lat:{lat}"

    # ========== Strategist (Combined Mode) ==========
    strategist:
      system_role: "You are an expert strategist for quantization optimization. Your job is to ANALYZE and DECIDE in ONE response. Think step by step."

      task_description: |
        Complete BOTH analysis and decision in one response.
        1. Analyze the historical trials to understand patterns
        2. Decide the next configuration based on your analysis

      analysis_steps: |
        ## PART 1: ANALYSIS

        ### Step 1: Method Performance
        For each method (gptq/awq/bnb): trials, success rate, avg metrics

        ### Step 2: Failure Patterns
        What parameter combinations caused failures?

        ### Step 3: Success Patterns
        What works well? Trade-offs observed?

        ### Step 4: Parameter Insights
        How do bits and group_size affect results?

      decision_steps: |
        ## PART 2: DECISION

        ### Step 5: Consider Targets
        Check the gap from targets, which objective needs improvement?

        ### Step 6: Avoid Repetition
        Ensure new config is DIFFERENT from tried ones

        ### Step 7: Choose Strategy
        - Early (< 20%): EXPLORATION
        - Mid (20-70%): BALANCED
        - Late (> 70%): EXPLOITATION

        ### Step 8: Design Next Config
        Pick method and params based on insights

      output_format: |
        Output ONE JSON with both analysis and decision:

        {
          "analysis": {
            "method_analysis": {...},
            "failure_patterns": [...],
            "success_patterns": [...],
            "parameter_insights": {...},
            "unexplored_regions": [...],
            "recommendations": [...]
          },
          "decision": {
            "thinking": {
              "analyzer_insights": "...",
              "target_gap": "...",
              "avoid_repeating": "...",
              "chosen_strategy_reason": "..."
            },
            "strategy": "exploration" / "exploitation" / "balanced",
            "next_config": {...(put all parameters FLAT, NOT nested in "parameters")},
            "rationale": "...",
            "confidence": 0.0-1.0
          }
        }

        Output ONLY the JSON object (no other text).

      section_headers:
        current_state: "# Current State"
        search_space: "# Search Space (Available Parameters)"
        already_tried: "# Already Tried Configurations (DO NOT REPEAT)"
        optimization_targets: "# Optimization Targets (Your Goals)"
        historical_trials: "# Historical Trials Summary"
        pareto_frontier: "# Current Pareto Frontier"
        your_task: "# Your Task"

      labels:
        trial: "Trial"
        progress: "Progress"
        budget_remaining: "Budget remaining"
        trials: "trials"
        solutions_on_frontier: "solutions on frontier"


  # ==================== 繁體中文版本 ====================
  zh:
    metadata:
      name: "繁體中文"
      description: "LLM 多代理優化的繁體中文提示詞"
      version: "1.0"

    analyzer:
      system_role: "你是一位量化優化試驗的專家分析師。請逐步思考分析。"

      task_description: |
        系統性地分析歷史試驗數據，了解哪些配置有效、哪些無效。

      analysis_requirements: |
        請按照以下思維鏈（Chain of Thought）進行分析：

        ## 步驟 1：方法表現分析
        針對每個量化方法（gptq/awq/bnb）分析：
        - 進行了多少次試驗？成功/失敗各幾次？
        - 平均的 accuracy_change、gpu_peak_change、latency_change
        - 哪個方法在各目標上表現最好？

        ## 步驟 2：失敗模式分析
        檢視失敗的試驗，識別：
        - 哪些參數組合導致失敗？
        - 是否有共同模式（例如：bits=2 總是失敗）？
        - 應該避免哪些方法/參數？

        ## 步驟 3：成功模式分析
        檢視成功的試驗（特別是 Pareto 解）：
        - 哪些參數組合效果好？
        - 準確率和壓縮率之間的權衡是什麼？
        - 哪些配置達到最佳平衡？

        ## 步驟 4：參數敏感度分析
        分析每個參數如何影響結果：
        - bits：2/3/4/8 bit 如何影響準確率和壓縮？
        - group_size：較小/較大的 group_size 是否有幫助？
        - 其他參數：有任何值得注意的觀察嗎？

        ## 步驟 5：策略性建議
        基於以上分析：
        - 哪些區域尚未探索但有潛力？
        - 下一步應該嘗試哪些具體配置？

      output_format: |
        輸出包含完整分析的 JSON 物件：
        {
          "method_analysis": {
            "gptq": {"trials": N, "success_rate": X, "avg_accuracy": Y, "avg_gpu": Z, "observations": "..."},
            "awq": {"trials": N, "success_rate": X, "avg_accuracy": Y, "avg_gpu": Z, "observations": "..."},
            "bnb": {"trials": N, "success_rate": X, "avg_accuracy": Y, "avg_gpu": Z, "observations": "..."}
          },
          "failure_patterns": [
            {"pattern": "描述", "affected_params": {...}, "suggestion": "避免/調整"}
          ],
          "success_patterns": [
            {"pattern": "描述", "winning_params": {...}, "trade_off": "準確率 vs 壓縮率"}
          ],
          "parameter_insights": {
            "bits": "關於 bits 影響的觀察",
            "group_size": "關於 group_size 影響的觀察",
            "other": "其他值得注意的發現"
          },
          "unexplored_regions": [
            {"method": "...", "params": {...}, "rationale": "基於以上分析，為何有潛力"}
          ],
          "recommendations": ["策略建議 1", "策略建議 2"]
        }

        僅輸出 JSON 物件（不要有其他文字）。

      section_headers:
        your_task: "# 你的任務"
        historical_trials: "# 歷史試驗摘要"
        pareto_frontier: "# 當前 Pareto 前沿"
        search_space: "# 搜尋空間"
        analysis_req: "# 分析要求"

      labels:
        total_trials: "總試驗次數"
        successful_trials: "成功試驗"
        failed_trials: "失敗/剪枝試驗"
        non_dominated_solutions: "個非支配解"
        recent_trials: "最近試驗"
        no_trials: "尚無試驗數據。"
        no_pareto: "尚無 Pareto 解。"

    planner:
      system_role: "你是量化優化的策略規劃師。請逐步思考後再做決策。"

      decision_process: |
        # 決策過程（思維鏈）
        請按照以下步驟決定下一個配置：

        ## 步驟 1：檢視 Analyzer 的發現
        - 哪些方法表現最好/最差？
        - 應該避免哪些失敗模式？
        - 應該利用哪些成功模式？
        - 哪些未探索區域有潛力？

        ## 步驟 2：考慮用戶目標
        - 最低可接受的準確率是多少？(accuracy_min)
        - 最大可接受的 GPU 使用量是多少？(gpu_peak_max)
        - 我們離達成這些目標還有多遠？

        ## 步驟 3：避免已嘗試的配置
        - 檢查「已嘗試」列表
        - 不要建議已經嘗試過的配置
        - 如果是利用策略，至少要改變一個參數

        ## 步驟 4：選擇策略
        - 早期（< 20%）：探索多樣的方法/參數
        - 中期（20-70%）：平衡探索和利用
        - 後期（> 70%）：專注於精細調整最佳配置

        ## 步驟 5：設計下一個配置
        - 根據分析洞察選擇方法
        - 選擇有潛力但尚未嘗試的參數
        - 確保所有參數都在搜尋空間內

      strategy_guide: |
        # 策略參考
        - **EXPLORATION（探索）**：嘗試新方法/參數，優先選擇 unexplored_regions
        - **EXPLOITATION（利用）**：精細調整成功配置，小幅參數調整
        - **BALANCED（平衡）**：兩者混合

      output_format: |
        以 JSON 格式提供你的決策：

        {
          "thinking": {
            "analyzer_insights": "我從分析中學到的（1-2 句話）",
            "target_gap": "我們離達成目標還有多遠？（1 句話）",
            "avoid_repeating": "我要避免哪些已嘗試的配置？（列出方法/bits）",
            "chosen_strategy_reason": "為什麼選擇這個策略（1 句話）"
          },
          "strategy": "exploration" / "exploitation" / "balanced",
          "next_config": {
            "method": "gptq" / "awq" / "bnb",
            "bits": ...,
            "group_size": ...,
            ...（參數直接放這裡，不要嵌套在 "parameters" 中）
          },
          "rationale": "此配置選擇的最終解釋（2-3 句話）",
          "confidence": 0.0-1.0
        }

        僅輸出 JSON 物件（不要有其他文字）。

      section_headers:
        current_state: "# 當前狀態"
        search_space: "# 搜尋空間（可用參數）"
        already_tried: "# 已嘗試的配置（請勿重複）"
        analysis_from_analyzer: "# 來自 AnalyzerAgent 的分析"
        optimization_targets: "# 優化目標（你的目標）"
        pareto_frontier: "# 當前 Pareto 前沿"
        your_task: "# 你的任務"

      labels:
        trial: "試驗"
        progress: "進度"
        budget_remaining: "剩餘預算"
        trials: "次試驗"
        solutions_on_frontier: "個解在前沿上"
        decide_next_config: "根據分析決定下一個試驗配置。重要：只能使用上方搜尋空間中的參數值，且不要重複已嘗試的配置！"

    formatting:
      methods: "方法"
      and_more: "... 還有 {count} 個"
      trial_format: "試驗 {num}"
      config_format: "{method}-{bits}bit"
      objectives_format: "準確率:{acc}, GPU:{gpu}, 延遲:{lat}"

    # ========== 策略師（合併模式）==========
    strategist:
      system_role: "你是量化優化的專家策略師。你的任務是在一次回應中完成分析和決策。請逐步思考。"

      task_description: |
        在一次回應中完成分析和決策：
        1. 分析歷史試驗以了解模式
        2. 根據分析決定下一個配置

      analysis_steps: |
        ## 第一部分：分析

        ### 步驟 1：方法表現
        針對每個方法（gptq/awq/bnb）：試驗次數、成功率、平均指標

        ### 步驟 2：失敗模式
        哪些參數組合導致失敗？

        ### 步驟 3：成功模式
        什麼效果好？觀察到的權衡？

        ### 步驟 4：參數洞察
        bits 和 group_size 如何影響結果？

      decision_steps: |
        ## 第二部分：決策

        ### 步驟 5：考慮目標
        檢查與目標的差距，哪個目標需要改善？

        ### 步驟 6：避免重複
        確保新配置與已嘗試的不同

        ### 步驟 7：選擇策略
        - 早期（< 20%）：探索
        - 中期（20-70%）：平衡
        - 後期（> 70%）：利用

        ### 步驟 8：設計下一個配置
        根據洞察選擇方法和參數

      output_format: |
        輸出一個包含分析和決策的 JSON：

        {
          "analysis": {
            "method_analysis": {...},
            "failure_patterns": [...],
            "success_patterns": [...],
            "parameter_insights": {...},
            "unexplored_regions": [...],
            "recommendations": [...]
          },
          "decision": {
            "thinking": {
              "analyzer_insights": "...",
              "target_gap": "...",
              "avoid_repeating": "...",
              "chosen_strategy_reason": "..."
            },
            "strategy": "exploration" / "exploitation" / "balanced",
            "next_config": {...（參數直接放這裡，不要嵌套在 "parameters" 中）},
            "rationale": "...",
            "confidence": 0.0-1.0
          }
        }

        僅輸出 JSON 物件（不要有其他文字）。

      section_headers:
        current_state: "# 當前狀態"
        search_space: "# 搜尋空間（可用參數）"
        already_tried: "# 已嘗試的配置（請勿重複）"
        optimization_targets: "# 優化目標（你的目標）"
        historical_trials: "# 歷史試驗摘要"
        pareto_frontier: "# 當前 Pareto 前沿"
        your_task: "# 你的任務"

      labels:
        trial: "試驗"
        progress: "進度"
        budget_remaining: "剩餘預算"
        trials: "次試驗"
        solutions_on_frontier: "個解在前沿上"
